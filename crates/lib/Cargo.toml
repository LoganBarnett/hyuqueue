[package]
name = "hyuqueue-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Re-exported below so the workspace's `LogLevel` / `LogFormat` are
# the foundation's types — `MergeConfig`'s `common` attribute on
# the server's `Config` expects exactly those.  No features pulled
# in; `pub mod logging` is unconditional in the foundation.
rust-template-foundation = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
